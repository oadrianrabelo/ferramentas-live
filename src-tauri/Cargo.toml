[package]
name = "ferramentas-live"
version = "0.0.0"
description = "Kit de ferramentas para transmissões ao vivo"
authors = ["Adrian Rabelo"]
license = "MIT"
repository = "https://github.com/oadrianrabelo/ferramentas-live"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ferramentas_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binários pequenos: o APK e os instaladores ficam bem mais leves.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
