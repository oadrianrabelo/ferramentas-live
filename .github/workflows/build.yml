name: Build

# Gera os instaladores. Chamado pela Release (anexa na release da tag)
# ou manualmente (Actions → Build → Run workflow) para testar: aí os arquivos
# ficam como artefatos da execução.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de uma release existente para anexar os arquivos (ex.: v1.0.0). Vazio = só artefatos.'
        type: string
        required: false
        default: ''
      only:
        description: 'Quais builds rodar'
        type: choice
        options: [todos, desktop, android, web]
        default: todos

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    if: contains(fromJSON('["", "todos", "desktop"]'), inputs.only || '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseDraft: false
          args: ${{ matrix.args }}
      - name: Guardar instaladores (execução manual)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn

  android:
    name: Android (APK)
    if: contains(fromJSON('["", "todos", "android"]'), inputs.only || '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK e NDK (já instalados no runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Gerar projeto Android
        run: |
          pnpm tauri android init --ci
          pnpm tauri icon assets/icon.png
      - name: Compilar APK (um por arquitetura = arquivo menor)
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7
      - name: Assinar APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            echo "::warning::Sem chave de assinatura nos secrets: usando uma chave temporária. Atualizações por cima não vão instalar — veja docs/ANDROID.md."
            KEYSTORE_PASSWORD=temporaria KEY_ALIAS=ferramentas
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ferramentas Live"
          fi
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk'); do
            abi=$(basename "$apk" | sed -E 's/app-(.*)-release-unsigned.apk/\1/')
            "$BT/zipalign" -f -p 4 "$apk" aligned.apk
            "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
              --out "out/ferramentas-live_${VERSION}_android-${abi}.apk" aligned.apk
          done
          rm -f release.jks aligned.apk
          ls -lh out
      - name: Anexar à release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" out/*.apk --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: android-apk
          path: out/*.apk

  web:
    name: Web (GitHub Pages)
    if: contains(fromJSON('["", "todos", "web"]'), inputs.only || '')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
