name: Release

# Fluxo: commits semânticos na main → release-please abre/atualiza um PR de versão
# (CHANGELOG + versão). Ao mesclar esse PR, a release é criada e os builds abaixo
# anexam os instaladores (Windows, macOS, Linux, Android) e publicam a versão web.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write
