<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1226" />
    <meta
      name="description"
      content="Ferramentas para transmissões ao vivo: cartões de comentário, tarjas, versículos, miniaturas, cronômetro, teleprompter, roteiro, sorteio e PIX."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ferramentas Live</title>
    <script>
      // aplica o tema antes de pintar, sem “piscar” claro/escuro
      try {
        const p = JSON.parse(localStorage.getItem('fl:prefs') || '{}').appearance;
        if (p === 'dark' || p === 'light') document.documentElement.dataset.theme = p;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
